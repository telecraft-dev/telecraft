# An example TLS terminator in front of one Instance.
#
# The Instance server holds no certificate: both of its endpoints speak plain
# HTTP and something in front terminates TLS. This file is what that looks
# like for the compose deployment beside it, and any terminator you already
# run does the same job.
#
# Certificates come from whatever already issues them for this host, mounted
# at /etc/nginx/tls. Nothing here reaches a network to obtain one.

# The OpAMP endpoint speaks WebSocket, so the upgrade has to survive the hop.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Collectors connect to wss://HOST/v1/opamp. It is the OpAMP address of
    # the Instance, which is a different port from the console.
    location /v1/opamp {
        proxy_pass http://telecraft:4320;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # A collector holds its connection open, so the idle timeouts are
        # longer than a request's.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # The console, the platform API, and the two probes.
    location / {
        proxy_pass http://telecraft:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
