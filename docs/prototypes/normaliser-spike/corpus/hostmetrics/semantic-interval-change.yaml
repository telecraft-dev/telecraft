# SEMANTIC change vs base.yaml: collection interval loosened 60s -> 300s.
receivers:
  hostmetrics:
    collection_interval: 300s
    scrapers:
      cpu: {}
      memory: {}
      filesystem:
        exclude_mount_points:
          mount_points:
            - /var/lib/docker/*
          match_type: regexp
processors:
  resourcedetection/system:
    detectors:
      - system
  batch: {}
exporters:
  otlp/gateway:
    endpoint: gateway.observability.svc.cluster.local:4317
    tls:
      ca_file: /etc/ssl/certs/ca-certificates.crt
service:
  pipelines:
    metrics:
      receivers:
        - hostmetrics
      processors:
        - resourcedetection/system
        - batch
      exporters:
        - otlp/gateway
