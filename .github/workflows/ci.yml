name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  vendor-word-lint:
    name: Vendor-word lint (ADR-0001)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go run ./tools/vendorlint

  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  # The live TelemetryProvider verification (issue #10): the same gated
  # suite demo.sh runs locally, against a real single-node Elasticsearch.
  # A separate job so the plain test job stays Docker-free and fast.
  telemetry-live:
    name: TelemetryProvider live (Elasticsearch)
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test ./internal/provider/telemetry/ -run Live -v -count=1
        env:
          TELECRAFT_TELEMETRY_LIVE_ENDPOINT: http://localhost:9200

  # The live forge-adapter contract test (issue #18): the GitHub App PR
  # flow against the provisioned estate-fixture repository. The suite
  # skips loudly — and this job stays green — when the FORGE_* secrets
  # are not exposed to this repo or the App installation cannot yet see
  # estate-fixture (ADR-0036 kit discipline: absent credentials never
  # fail the suite).
  forge-live:
    name: Forge adapter live (GitHub App)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test ./internal/provider/forge/ -run Live -v -count=1
        env:
          FORGE_APP_ID: ${{ secrets.FORGE_APP_ID }}
          FORGE_INSTALLATION_ID: ${{ secrets.FORGE_INSTALLATION_ID }}
          FORGE_APP_PRIVATE_KEY: ${{ secrets.FORGE_APP_PRIVATE_KEY }}
