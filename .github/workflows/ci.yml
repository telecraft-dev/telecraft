name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # What changed decides what runs. A documentation-only pull request has no
  # business installing a browser or standing up Elasticsearch, and when the
  # runners are slow that wait is the whole review latency. The four checks
  # below this job are the deliberate exceptions: each reads the whole tree
  # rather than the code in it, so a documentation-only change is exactly
  # the change that can break them. They carry no `if:` and run on
  # everything, always.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      console: ${{ steps.filter.outputs.console }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A push whose before-sha is unknown (first push, force-push) has no
          # usable range: run everything rather than guess.
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true"    >> "$GITHUB_OUTPUT"
            echo "console=true" >> "$GITHUB_OUTPUT"
            echo "No usable diff base; running every job."
            exit 0
          fi
          files=$(git diff --name-only "$BASE" "$HEAD")
          echo "Changed files:"; echo "$files" | sed 's/^/  /'
          # Anything that is not documentation, and not a file only the docs
          # site consumes, counts as code.
          if echo "$files" | grep -qvE '^(docs/|README\.md$|\.github/workflows/docs-dispatch\.yml$)'; then
            code=true
          else
            code=false
          fi
          if echo "$files" | grep -qE '^(console/|internal/console/|\.github/workflows/ci\.yml$)'; then
            console=true
          else
            console=$code
          fi
          echo "code=$code"       >> "$GITHUB_OUTPUT"
          echo "console=$console" >> "$GITHUB_OUTPUT"
          echo "code=$code console=$console"

  vendor-word-lint:
    name: Vendor-word lint (ADR-0001)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go run ./tools/vendorlint

  # The documentation front-matter check. Ungated for the same reason the
  # vendor-word lint is: it scans docs/**, so a documentation-only change is
  # exactly the change that can break it.
  #
  # It exists because the site is built somewhere else (issue #74). The
  # front matter and docs/nav.yaml together are the whole contract between
  # this repository and telecraft.dev, and a page whose block does not parse
  # fails over there, after merge, in a build nobody here is watching.
  docs-lint:
    name: Documentation front matter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go run ./tools/docslint

  # The tracked-executable check (issue #122). Ungated for a third reason:
  # it reads the index rather than a language, so every change is a change
  # that can introduce what it looks for. A stray build artefact arrives
  # through a documentation branch as easily as through a Go one, and
  # gating it on `code` would leave the one commit that adds a binary
  # beside a guide unguarded.
  #
  # It exists because a 3.4 MB `vendorlint` executable sat at the
  # repository root from the first scaffolding commit and reached every
  # clone and every generated source tarball. Nothing rebuilt it and
  # nothing verified it: a reviewer reading a diff sees a path rather than
  # a file type, which is the failure no amount of care in review catches.
  #
  # `git ls-files` needs only the index, so the default shallow checkout is
  # enough.
  binary-lint:
    name: No tracked binaries (issue #122)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go run ./tools/binlint

  # The Go formatting check (issue #146). Ungated for a fourth reason: the
  # tree holds Go that `code` calls documentation. `changes` sets `code`
  # false for a branch touching only `docs/**`, and the normaliser spike
  # under `docs/prototypes/` is Go in a module of its own, so gating this
  # on `code` would leave the Go the build job never compiles unguarded as
  # well. Formatting is a property of the tree rather than of
  # a diff range, and the check costs a checkout and one `go run`, so there
  # is nothing to buy by gating it.
  #
  # It exists because three test files sat unformatted for months and every
  # check the repository had went green on all of them. `go build` and
  # `go test` do not read layout, and `go vet` reports suspicious
  # constructs rather than formatting, so an unformatted file passed
  # everything.
  #
  # This is `go run ./tools/fmtlint` rather than a bare `gofmt -l .` step
  # on purpose. `gofmt -l` exits 0 whether or not it names a file, so the
  # obvious step is green while it prints the problem. The tool exits 1 on
  # a finding, reads the index rather than the working tree, and carries a
  # self-test that makes `go test ./...` fail on the next drift before it
  # ever reaches a runner.
  format-lint:
    name: Go formatting (issue #146)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go run ./tools/fmtlint

  test:
    name: Build and test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  # The live TelemetryProvider verification (issue #10): the same gated
  # suite demo.sh runs locally, against a real single-node Elasticsearch.
  # A separate job so the plain test job stays Docker-free and fast.
  telemetry-live:
    name: TelemetryProvider live (Elasticsearch)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test ./internal/provider/telemetry/ -run Live -v -count=1
        env:
          TELECRAFT_TELEMETRY_LIVE_ENDPOINT: http://localhost:9200

  # The live forge-adapter contract test (issue #18): the GitHub App PR
  # flow against the provisioned estate-fixture repository. The suite
  # skips loudly, and this job stays green, when the FORGE_* secrets
  # are not exposed to this repo or the App installation cannot yet see
  # estate-fixture (ADR-0036 kit discipline: absent credentials never
  # fail the suite).
  forge-live:
    name: Forge adapter live (GitHub App)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test ./internal/provider/forge/ -run Live -v -count=1
        env:
          FORGE_APP_ID: ${{ secrets.FORGE_APP_ID }}
          FORGE_INSTALLATION_ID: ${{ secrets.FORGE_INSTALLATION_ID }}
          FORGE_APP_PRIVATE_KEY: ${{ secrets.FORGE_APP_PRIVATE_KEY }}

  # The console (issue #25, ADR-0045): typecheck, unit tests, the palette
  # check over the design tokens, build, the zero-CDN check and the bundle
  # budget over the built bundle, and the Playwright suite against the
  # fixture backend. The air-gap check lives here beside the vendor-word
  # lint, not in a doc (ADR-0045 §5), and ADR-0047 put the accessibility
  # floors beside it for the same reason: they are numbers, so they can be
  # regressed. The entry chunk's gzipped size is the third such number
  # (issue #125): route-level code splitting is worth nothing if it can
  # come undone in a review nobody measures.
  console:
    name: Console (ADR-0045)
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:palette
      - run: npm run build
      - run: npm run check:zero-cdn
      - run: npm run check:bundle-budget
      # Playwright's browser, cached on the lockfile so a run that has not
      # changed its dependencies downloads nothing.
      #
      # `--with-deps` is deliberately absent. It shells out to apt-get
      # against the Ubuntu mirrors, and measured over three consecutive
      # runs it cost 138s, 362s, and then hung past 25 minutes, against
      # 14s for the suite it exists to enable and ~20s for every other step
      # in this job combined. The GitHub-hosted ubuntu-latest image already
      # ships the shared libraries Chromium needs; `--with-deps` is for
      # containers and self-hosted runners, which this is not. If that ever
      # stops being true the next step fails immediately and says which
      # library is missing, which is a better failure than a hang.
      - uses: actions/cache@v4
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('console/package-lock.json') }}
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npm run e2e

  # The public demo's two halves (issue #50), built here so they cannot
  # regress: `telecraft snapshot` producing the platform API's documents
  # from a real estate through the real evaluators, and the console built
  # in demo mode reading one. The estate under internal/console/testdata is
  # the small one; telecraft-dev/estate-demo runs the same two commands
  # over the curated one on every push and deploys the result.
  demo:
    name: Demo snapshot and bundle (issue #50)
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
        working-directory: console
      - run: npm run build:demo
        working-directory: console
      # The zero-CDN rule holds on the demo bundle exactly as on the
      # instance bundle (ADR-0045 §5). It runs over the built console
      # before the snapshot is placed beside it: the snapshot is estate
      # data (endpoints and module paths the console prints and never
      # fetches), not a bundled artefact.
      - run: npm run check:zero-cdn
        working-directory: console
      - name: Generate a snapshot over the fixture estate and load it
        run: |
          go run ./cmd/telecraft snapshot \
            -estate internal/console/testdata/estate \
            -library internal/console/testdata/estate/requirements \
            -exemptions internal/console/testdata/estate/exemptions \
            -rows internal/console/testdata/estate/rows.yaml \
            -readings internal/console/testdata/estate/readings.yaml \
            -commit 1111111111111111111111111111111111111111 \
            -team data-flow \
            -out console/dist/demo-snapshot.json
          node -e "const s=require('./console/dist/demo-snapshot.json'); if (!s.estate.cards.length) throw new Error('the snapshot carries no cards')"
      # Every Workspace URL has to resolve to a document, or a static host
      # answers it from its not-found page, the right screen behind a 404
      # (ADR-0042 §3.5).
      - name: Every Workspace URL has an entry document
        working-directory: console
        run: |
          node tools/assemble-site.mjs dist
          for route in estate topology compose catalogue; do
            test -f "dist/$route.html" || { echo "no dist/$route.html"; exit 1; }
            test -f "dist/$route/index.html" || { echo "no dist/$route/index.html"; exit 1; }
          done
          test -f dist/404.html || { echo "no dist/404.html"; exit 1; }
