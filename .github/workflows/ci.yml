name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A weekly run over an unchanged tree. Two things only a schedule
  # catches: a live credential that expired since the last code change,
  # and an advisory published against a dependency nobody has bumped.
  # On this event the forge suite is required to run rather than skip;
  # the guard is in that job.
  schedule:
    - cron: '17 6 * * 1'

# Read-only. Nothing in this workflow publishes; the release workflow
# carries its own grants.
permissions:
  contents: read

# One run per ref. A superseded push to a pull request cancels the run it
# replaced; a run on main or on the schedule is never cancelled mid-flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What changed decides what runs. A documentation-only pull request has no
  # business installing a browser or standing up Elasticsearch, and when the
  # runners are slow that wait is the whole review latency. The four checks
  # below this job are the deliberate exceptions: each reads the whole tree
  # rather than the code in it, so a documentation-only change is exactly
  # the change that can break them. They carry no `if:` and run on
  # everything, always.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.filter.outputs.code }}
      console: ${{ steps.filter.outputs.console }}
      image: ${{ steps.filter.outputs.image }}
      chart: ${{ steps.filter.outputs.chart }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A push whose before-sha is unknown (first push, force-push) has no
          # usable range: run everything rather than guess.
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true"    >> "$GITHUB_OUTPUT"
            echo "console=true" >> "$GITHUB_OUTPUT"
            echo "image=true"   >> "$GITHUB_OUTPUT"
            echo "chart=true"   >> "$GITHUB_OUTPUT"
            echo "No usable diff base; running every job."
            exit 0
          fi
          files=$(git diff --name-only "$BASE" "$HEAD")
          echo "Changed files:"; echo "$files" | sed 's/^/  /'
          # Anything that is not documentation, and not a file only the docs
          # site consumes, counts as code.
          if echo "$files" | grep -qvE '^(docs/|README\.md$|\.github/workflows/docs-dispatch\.yml$)'; then
            code=true
          else
            code=false
          fi
          if echo "$files" | grep -qE '^(console/|internal/console/|\.github/workflows/ci\.yml$)'; then
            console=true
          else
            console=$code
          fi
          # The image's own files. A Go or console change is covered by the
          # build and the console jobs; what this job catches is the image
          # itself failing to assemble or failing to serve.
          if echo "$files" | grep -qE '^(Dockerfile|\.dockerignore|tools/image/.*|\.github/workflows/ci\.yml)$'; then
            image=true
          else
            image=false
          fi
          echo "image=$image"     >> "$GITHUB_OUTPUT"
          # The chart's own files, and the two sources chartlint reads
          # rather than repeats. A flag that moves in serve.go, or a probe
          # route that moves in the instance server, is exactly the change
          # that leaves the chart setting the old one.
          if echo "$files" | grep -qE '^(charts/.*|tools/chart/.*|tools/chartlint/.*|cmd/telecraft/serve\.go|internal/instance/api\.go|\.github/workflows/ci\.yml)$'; then
            chart=true
          else
            chart=false
          fi
          echo "chart=$chart"     >> "$GITHUB_OUTPUT"
          echo "code=$code"       >> "$GITHUB_OUTPUT"
          echo "console=$console" >> "$GITHUB_OUTPUT"
          echo "code=$code console=$console"

  vendor-word-lint:
    name: Vendor-word lint (ADR-0001)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run ./tools/vendorlint

  # The documentation front-matter check. Ungated for the same reason the
  # vendor-word lint is: it scans docs/**, so a documentation-only change is
  # exactly the change that can break it.
  #
  # It exists because the site is built somewhere else (issue #74). The
  # front matter and docs/nav.yaml together are the whole contract between
  # this repository and telecraft.dev, and a page whose block does not parse
  # fails over there, after merge, in a build nobody here is watching.
  docs-lint:
    name: Documentation front matter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run ./tools/docslint

  # The tracked-executable check (issue #122). Ungated for a third reason:
  # it reads the index rather than a language, so every change is a change
  # that can introduce what it looks for. A stray build artefact arrives
  # through a documentation branch as easily as through a Go one, and
  # gating it on `code` would leave the one commit that adds a binary
  # beside a guide unguarded.
  #
  # It exists because a 3.4 MB `vendorlint` executable sat at the
  # repository root from the first scaffolding commit and reached every
  # clone and every generated source tarball. Nothing rebuilt it and
  # nothing verified it: a reviewer reading a diff sees a path rather than
  # a file type, which is the failure no amount of care in review catches.
  #
  # `git ls-files` needs only the index, so the default shallow checkout is
  # enough.
  binary-lint:
    # Quoted, because an unquoted `#` starts a YAML comment and the check
    # would register under a truncated name no protection rule could match.
    name: 'No tracked binaries (issue #122)'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run ./tools/binlint

  # The Go formatting check (issue #146). Ungated for a fourth reason: the
  # tree holds Go that `code` calls documentation. `changes` sets `code`
  # false for a branch touching only `docs/**`, and the normaliser spike
  # under `docs/prototypes/` is Go in a module of its own, so gating this
  # on `code` would leave the Go the build job never compiles unguarded as
  # well. Formatting is a property of the tree rather than of
  # a diff range, and the check costs a checkout and one `go run`, so there
  # is nothing to buy by gating it.
  #
  # It exists because three test files sat unformatted for months and every
  # check the repository had went green on all of them. `go build` and
  # `go test` do not read layout, and `go vet` reports suspicious
  # constructs rather than formatting, so an unformatted file passed
  # everything.
  #
  # This is `go run ./tools/fmtlint` rather than a bare `gofmt -l .` step
  # on purpose. `gofmt -l` exits 0 whether or not it names a file, so the
  # obvious step is green while it prints the problem. The tool exits 1 on
  # a finding, reads the index rather than the working tree, and carries a
  # self-test that makes `go test ./...` fail on the next drift before it
  # ever reaches a runner.
  format-lint:
    name: 'Go formatting (issue #146)'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run ./tools/fmtlint

  # The workflow files themselves. They are load-bearing YAML that nothing
  # else reads before an event does, so a syntax slip, a wrong context
  # expression or an unquoted interpolation is otherwise discovered by the
  # push that needed the workflow. Ungated for the same reason as the four
  # checks above: a change anywhere can be a change to a workflow.
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Style-level shellcheck findings stay a matter for review; what
      # this job exists to fail on is a script or expression that is
      # wrong, not one that could be tidier.
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
        env:
          SHELLCHECK_OPTS: --severity=warning

  test:
    name: Build and test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      # `-race` because the instance server serves the console, OpAMP and
      # the probes concurrently, and a data race is exactly the bug a plain
      # run goes green on. `-shuffle=on` so an order-dependent test fails
      # here rather than on somebody's machine.
      - run: go test -race -shuffle=on ./...
      # Known advisories, resolved call-graph aware: an advisory against a
      # function nothing here reaches is a note rather than a failure.
      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  # The live TelemetryProvider verification (issue #10): the same gated
  # suite demo.sh runs locally, against a real single-node Elasticsearch.
  # A separate job so the plain test job stays Docker-free and fast.
  telemetry-live:
    name: TelemetryProvider live (Elasticsearch)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./internal/provider/telemetry/ -run Live -v -count=1
        env:
          TELECRAFT_TELEMETRY_LIVE_ENDPOINT: http://localhost:9200

  # The live forge-adapter contract test (issue #18): the GitHub App PR
  # flow against the provisioned estate-fixture repository. The suite
  # skips loudly, and this job stays green, when the FORGE_* secrets
  # are not exposed to this repo or the App installation cannot yet see
  # estate-fixture (ADR-0036 kit discipline: absent credentials never
  # fail the suite).
  forge-live:
    name: Forge adapter live (GitHub App)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The skip-on-absent-credentials discipline reads as a pass, so a
      # credential that quietly dies would stay green forever. The weekly
      # scheduled run is the backstop: on that event, absent secrets are
      # the finding, not a reason to skip.
      - name: A scheduled run does not accept a skip
        if: github.event_name == 'schedule'
        env:
          FORGE_APP_ID: ${{ secrets.FORGE_APP_ID }}
        run: |
          if [ -z "$FORGE_APP_ID" ]; then
            echo "::error::The FORGE_* secrets are absent, so the weekly live run would skip. On a schedule that is a dead credential, not a pass."
            exit 1
          fi
      - run: go test ./internal/provider/forge/ -run Live -v -count=1
        env:
          FORGE_APP_ID: ${{ secrets.FORGE_APP_ID }}
          FORGE_INSTALLATION_ID: ${{ secrets.FORGE_INSTALLATION_ID }}
          FORGE_APP_PRIVATE_KEY: ${{ secrets.FORGE_APP_PRIVATE_KEY }}

  # The console (issue #25, ADR-0045): typecheck, unit tests, the palette
  # check over the design tokens, build, the zero-CDN check and the bundle
  # budget over the built bundle, and the Playwright suite against the
  # fixture backend. The air-gap check lives here beside the vendor-word
  # lint, not in a doc (ADR-0045 §5), and ADR-0047 put the accessibility
  # floors beside it for the same reason: they are numbers, so they can be
  # regressed. The entry chunk's gzipped size is the third such number
  # (issue #125): route-level code splitting is worth nothing if it can
  # come undone in a review nobody measures.
  console:
    name: Console (ADR-0045)
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:palette
      - run: npm run build
      - run: npm run check:zero-cdn
      - run: npm run check:bundle-budget
      - run: npm run bundle
      - run: test -f ../internal/consoleassets/dist/index.html
      # Playwright's browser, cached on the lockfile so a run that has not
      # changed its dependencies downloads nothing.
      #
      # `--with-deps` is deliberately absent. It shells out to apt-get
      # against the Ubuntu mirrors, and measured over three consecutive
      # runs it cost 138s, 362s, and then hung past 25 minutes, against
      # 14s for the suite it exists to enable and ~20s for every other step
      # in this job combined. The GitHub-hosted ubuntu-latest image already
      # ships the shared libraries Chromium needs; `--with-deps` is for
      # containers and self-hosted runners, which this is not. If that ever
      # stops being true the next step fails immediately and says which
      # library is missing, which is a better failure than a hang.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('console/package-lock.json') }}
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npm run e2e
      # The traces and screenshots Playwright writes on a failure, kept
      # where the reader debugging it can fetch them. On a green run there
      # is nothing to keep and the step uploads nothing.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: playwright-output
          path: console/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The container image (ADR-0068). It builds and never pushes: a pull request
  # cannot publish, and what is worth catching before a tag is whether the
  # image assembles at all and whether what it assembled runs.
  #
  # No QEMU. The Dockerfile has no RUN instruction, so nothing executes for
  # either architecture at build time: Go cross-compiles both binaries and
  # buildx copies each into its own manifest.
  image:
    name: Container image (ADR-0068)
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: telecraft
      VERSION: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - run: go run ./tools/imagelint
      - name: Stage the build context
        run: tools/image/stage.sh
      - name: Both architectures assemble
        run: STAGED=1 tools/image/build.sh
      # The air-gap rule, checked rather than asserted (ADR-0068 §6).
      - name: The image serves with no network
        run: |
          STAGED=1 PLATFORMS=linux/amd64 LOAD=1 tools/image/build.sh
          tools/image/offline.sh "$IMAGE:$VERSION"

  # Every platform a release attaches, minus the one the test job compiles
  # natively (ADR-0081 §1). The image job also builds both Linux
  # architectures, but it runs only when the image's own files change, so
  # on an ordinary Go change this loop is the only cross-compile there is.
  # Without it a broken build constraint or a platform-specific import is
  # discovered by a tag push, which is the one moment there is no way back.
  #
  # Compiled and thrown away. Running them is not possible here and is not
  # the point: what breaks a cross-compile is a build constraint or a
  # platform-specific import, and both fail at `go build`.
  workstations:
    name: Workstation binaries (ADR-0081)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Every platform a release attaches still cross-compiles
        run: |
          set -euo pipefail
          for target in darwin/arm64 darwin/amd64 windows/amd64 linux/arm64; do
            echo "building $target"
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -trimpath -o /dev/null ./cmd/telecraft
          done

  # The chart (ADR-0068 §5, ADR-0074 §5). Three checks in one job, cheapest
  # first, because the last of them stands up a cluster.
  #
  # `chartlint` renders nothing and reads the command the chart deploys, so
  # it catches the drift that has no other reader. `golden.sh` holds the
  # three documented shapes to their manifests and requires each refusal to
  # fail. `kind.sh` installs both estate shapes and requires what it
  # installed to serve, which is the half a renderer cannot see.
  #
  # The image comes from this repository's own staging scripts rather than
  # from the registry: the chart and the image it deploys are one commit,
  # and installing yesterday's published image would check the chart
  # against something this pull request did not build.
  chart:
    name: Helm chart (ADR-0068)
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      IMAGE: telecraft
      VERSION: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - run: go run ./tools/chartlint
      - run: helm lint charts/telecraft --values charts/telecraft/testdata/minimal.yaml
      - run: tools/chart/golden.sh
      - name: Build the image the chart installs
        run: |
          tools/image/stage.sh
          STAGED=1 PLATFORMS=linux/amd64 LOAD=1 tools/image/build.sh
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          install_only: true
      - name: The chart installs and serves
        run: IMAGE="$IMAGE:$VERSION" tools/chart/kind.sh

  # The public demo's two halves (issue #50), built here so they cannot
  # regress: `telecraft snapshot` producing the platform API's documents
  # from a real estate through the real evaluators, and the console built
  # in demo mode reading one. The estate under internal/console/testdata is
  # the small one; telecraft-dev/estate-demo runs the same two commands
  # over the curated one on every push and deploys the result.
  demo:
    name: 'Demo snapshot and bundle (issue #50)'
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
        working-directory: console
      - run: npm run build:demo
        working-directory: console
      # The zero-CDN rule holds on the demo bundle exactly as on the
      # instance bundle (ADR-0045 §5). It runs over the built console
      # before the snapshot is placed beside it: the snapshot is estate
      # data (endpoints and module paths the console prints and never
      # fetches), not a bundled artefact.
      - run: npm run check:zero-cdn
        working-directory: console
      - name: Generate a snapshot over the fixture estate and load it
        run: |
          go run ./cmd/telecraft snapshot \
            -estate internal/console/testdata/estate \
            -library internal/console/testdata/estate/requirements \
            -exemptions internal/console/testdata/estate/exemptions \
            -rows internal/console/testdata/estate/rows.yaml \
            -readings internal/console/testdata/estate/readings.yaml \
            -commit 1111111111111111111111111111111111111111 \
            -team data-flow \
            -out console/dist/demo-snapshot.json
          node -e "const s=require('./console/dist/demo-snapshot.json'); if (!s.estate.cards.length) throw new Error('the snapshot carries no cards')"
      # Every Workspace URL has to resolve to a document, or a static host
      # answers it from its not-found page, the right screen behind a 404
      # (ADR-0042 §3.5).
      - name: Every Workspace URL has an entry document
        working-directory: console
        run: |
          node tools/assemble-site.mjs dist
          for route in estate topology compose catalogue; do
            test -f "dist/$route.html" || { echo "no dist/$route.html"; exit 1; }
            test -f "dist/$route/index.html" || { echo "no dist/$route/index.html"; exit 1; }
          done
          test -f dist/404.html || { echo "no dist/404.html"; exit 1; }
