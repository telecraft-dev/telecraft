name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  vendor-word-lint:
    name: Vendor-word lint (ADR-0001)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go run ./tools/vendorlint

  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  # The live TelemetryProvider verification (issue #10): the same gated
  # suite demo.sh runs locally, against a real single-node Elasticsearch.
  # A separate job so the plain test job stays Docker-free and fast.
  telemetry-live:
    name: TelemetryProvider live (Elasticsearch)
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test ./internal/provider/telemetry/ -run Live -v -count=1
        env:
          TELECRAFT_TELEMETRY_LIVE_ENDPOINT: http://localhost:9200

  # The live forge-adapter contract test (issue #18): the GitHub App PR
  # flow against the provisioned estate-fixture repository. The suite
  # skips loudly — and this job stays green — when the FORGE_* secrets
  # are not exposed to this repo or the App installation cannot yet see
  # estate-fixture (ADR-0036 kit discipline: absent credentials never
  # fail the suite).
  forge-live:
    name: Forge adapter live (GitHub App)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test ./internal/provider/forge/ -run Live -v -count=1
        env:
          FORGE_APP_ID: ${{ secrets.FORGE_APP_ID }}
          FORGE_INSTALLATION_ID: ${{ secrets.FORGE_INSTALLATION_ID }}
          FORGE_APP_PRIVATE_KEY: ${{ secrets.FORGE_APP_PRIVATE_KEY }}

  # The console (issue #25, ADR-0045): typecheck, unit tests, build, the
  # zero-CDN check over the built bundle, and the Playwright suite against
  # the fixture backend. The air-gap check lives here beside the
  # vendor-word lint, not in a doc (ADR-0045 §5).
  console:
    name: Console (ADR-0045)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:zero-cdn
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  # The public demo's two halves (issue #50), built here so they cannot
  # regress: `telecraft snapshot` producing the platform API's documents
  # from a real estate through the real evaluators, and the console built
  # in demo mode reading one. The estate under internal/console/testdata is
  # the small one; telecraft-dev/estate-demo runs the same two commands
  # over the curated one on every push and deploys the result.
  demo:
    name: Demo snapshot and bundle (issue #50)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
        working-directory: console
      - run: npm run build:demo
        working-directory: console
      # The zero-CDN rule holds on the demo bundle exactly as on the
      # instance bundle (ADR-0045 §5). It runs over the built console
      # before the snapshot is placed beside it: the snapshot is estate
      # data — endpoints and module paths the console prints and never
      # fetches — not a bundled artefact.
      - run: npm run check:zero-cdn
        working-directory: console
      - name: Generate a snapshot over the fixture estate and load it
        run: |
          go run ./cmd/telecraft snapshot \
            -estate internal/console/testdata/estate \
            -catalogue internal/console/testdata/estate/catalogues/catalogue-v1.0.0.json \
            -library internal/console/testdata/estate/requirements \
            -exemptions internal/console/testdata/estate/exemptions \
            -rows internal/console/testdata/estate/rows.yaml \
            -readings internal/console/testdata/estate/readings.yaml \
            -commit 1111111111111111111111111111111111111111 \
            -team data-flow \
            -out console/dist/demo-snapshot.json
          node -e "const s=require('./console/dist/demo-snapshot.json'); if (!s.estate.cards.length) throw new Error('the snapshot carries no cards')"
      # Every Workspace URL has to resolve to a document, or a static host
      # answers it from its not-found page — the right screen behind a 404
      # (ADR-0042 §3.5).
      - name: Every Workspace URL has an entry document
        working-directory: console
        run: |
          node tools/assemble-site.mjs dist
          for route in estate topology compose catalogue; do
            test -f "dist/$route.html" || { echo "no dist/$route.html"; exit 1; }
            test -f "dist/$route/index.html" || { echo "no dist/$route/index.html"; exit 1; }
          done
          test -f dist/404.html || { echo "no dist/404.html"; exit 1; }
