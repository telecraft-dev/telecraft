name: Release

# A release is a tag, and the tag is most of what a release is (ADR-0049).
# Both public surfaces build this repository from a git ref rather than from
# something we hand them: estate-demo checks out the platform and runs its
# evaluators, and the documentation site consumes the token sheets. So the
# thing that has to exist for issue #86 is not a binary. It is a ref that
# stopped moving, with the sheets that travel to the second repository
# attached to it.
#
# What this publishes is ADR-0049 §3 as ADR-0068 and ADR-0081 amended it:
# one image, one chart, the design archive, and a CLI binary for every
# workstation the product expects to meet. The console bundle is not a
# separate artefact any more; it is inside the binary (ADR-0068 §4).
#
# The two Linux binaries come out of the image's staged context, which
# builds them anyway. The other three are cross-compiled here: the build is
# CGO_ENABLED=0 with -trimpath, so a platform is a GOOS and GOARCH pair and
# nothing else.
#
# Cutting a release is one push of one annotated tag. Everything below is
# the machine's half; docs/contributing/releases.md is the human's.

on:
  push:
    tags:
      - 'v*'

permissions:
  # contents: to create the release and attach the files. packages: to push
  # the image and move the `release` tag beside it. id-token and attestations:
  # for the build attestation, which needs no key this project holds
  # (ADR-0068 §7).
  contents: write
  packages: write
  id-token: write
  attestations: write

# One release run at a time, and never cancelled: two tags pushed close
# together would otherwise interleave their registry pushes, and the
# `release` tag would name whichever finished last.
concurrency:
  group: release

jobs:
  publish:
    name: Publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history, because the guard below asks whether this tag sits on
      # main and a shallow checkout cannot answer that.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Two guards, both for the same footgun: a tag is a push, and a push
      # has no review. Nothing else stands between a typed command and a
      # published claim.
      #
      # The shape guard rejects anything that is not vMAJOR.MINOR.PATCH with
      # an optional pre-release suffix, so `v0.2` and `v0.2.0.1` fail here
      # rather than becoming a version other repositories have to parse.
      #
      # The ancestry guard rejects a tag on a branch. Main is the reviewed,
      # green history (docs/contributing/index.md); a tag anywhere else
      # publishes code no reviewer saw, and estate-demo would then build the
      # public demo from it.
      - name: The tag is well formed and sits on main
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::$TAG is not vMAJOR.MINOR.PATCH[-prerelease] (ADR-0049 §1)"
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at $GITHUB_SHA, which is not on main (ADR-0049 §2)"
            exit 1
          fi
          # A pre-release is a rehearsal: it publishes artefacts and never
          # reaches the public demo (ADR-0049 §6). The suffix is the whole
          # signal, here and in demo-dispatch.yml.
          case "$TAG" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "$TAG is on main; prerelease=$prerelease"

      # The third guard, and it runs here rather than beside the publish
      # step for a reason a failed run makes obvious: everything below
      # pushes something. A tag whose annotation cannot open the notes
      # used to fail after the image and the chart were already in the
      # registry, leaving a version the registry names and the releases
      # page does not. Missing is fatal, and `Breaking: none` is a normal
      # answer that takes two seconds to write; a tag cannot be corrected
      # afterwards.
      - name: Take the headline from the tag
        id: headline
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          message=$(git tag -l --format='%(contents)' "$TAG")
          breaking=$(printf '%s\n' "$message" | grep -m1 '^Breaking:' || true)
          new=$(printf '%s\n' "$message" | grep -m1 '^New:' || true)
          if [ -z "$breaking" ] || [ -z "$new" ]; then
            echo "The annotation on $TAG must carry a Breaking: line and a New: line." >&2
            echo "Either may say none. What it says now:" >&2
            printf '%s\n' "$message" >&2
            exit 1
          fi
          {
            echo "text<<HEADLINE_EOF"
            printf '%s\n\n%s\n' "**$breaking**" "**$new**"
            echo "HEADLINE_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # The console is built once and both binaries are cross-compiled from
      # it, so the bytes attached below and the bytes inside the image are one
      # build rather than two of one commit (ADR-0068 §2).
      - name: Stage the image's build context
        env:
          VERSION: ${{ github.ref_name }}
        run: tools/image/stage.sh

      # An image that needed one fetch to become ready fails here, before
      # anything is published, rather than in somebody's air gap (ADR-0068 §6).
      - name: The image serves with no network
        env:
          IMAGE: telecraft
          VERSION: ${{ github.ref_name }}
        run: |
          STAGED=1 PLATFORMS=linux/amd64 LOAD=1 tools/image/build.sh
          tools/image/offline.sh "telecraft:$VERSION"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Two tags and no third (ADR-0068 §3). A pre-release publishes its
      # version tag and moves nothing the world follows, which is ADR-0049 §6
      # in the registry.
      #
      # The registry's `release` tag obeys the same rule as the git pointer
      # demo-dispatch.yml moves: only the newest stable version takes it. A
      # v0.5.7 cut after v0.7.1 is a fix on an older line, and dragging the
      # registry pointer backwards would hand anyone deploying by that tag a
      # silent downgrade while the demo stayed current.
      - name: Push the image index
        id: image
        env:
          VERSION: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "false" ]; then
            # No `head` in this pipeline: with `pipefail` a reader that
            # closes early can fail the step for no reason.
            stable=$(git tag --list 'v*' --sort=-v:refname | grep -v -- '-' || true)
            newest=$(printf '%s\n' "$stable" | sed -n '1p')
            if [ "$newest" = "$VERSION" ]; then
              export TAGS=release
            else
              echo "$VERSION is older than $newest: the registry pointer stays on $newest."
            fi
          fi
          STAGED=1 PUSH=1 tools/image/build.sh
          digest=$(docker buildx imagetools inspect \
            "ghcr.io/telecraft-dev/telecraft:$VERSION" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "ghcr.io/telecraft-dev/telecraft@$digest"

      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ghcr.io/telecraft-dev/telecraft
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      # The chart, on the same tag push and to the same registry, so one
      # number answers what to deploy (ADR-0068 §5). `version` is the tag
      # without its leading v, because Helm requires SemVer without one;
      # `appVersion` is the tag as written, and it is what the chart's own
      # image tag defaults to.
      #
      # The chart is checked before it is pushed, over the values that
      # install the published image, because a chart that renders wrong is
      # published in one command and corrected only by the next release.
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: Package and push the chart
        id: chart
        env:
          VERSION: ${{ github.ref_name }}
          # Helm reads the Docker credential the login step wrote, but says
          # so nowhere the next reader of this file would find it. This
          # login is that sentence made a command.
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          go run ./tools/chartlint
          tools/chart/golden.sh
          printf '%s' "$REGISTRY_TOKEN" |
            helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
          helm package charts/telecraft \
            --version "${VERSION#v}" --app-version "$VERSION" \
            --destination "$RUNNER_TEMP"
          package="$RUNNER_TEMP/telecraft-${VERSION#v}.tgz"
          helm push "$package" oci://ghcr.io/telecraft-dev/charts
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: ${{ steps.chart.outputs.package }}

      # The design artefact: the four distributed files of
      # docs/branding/design-system.md "Distribution", laid out the way a
      # consumer serves them. `fonts.css` reaches its faces by relative URL
      # (`./JetBrainsMono.woff2`), so the fonts directory travels whole or
      # the sheet resolves to nothing. The two OFL texts travel with the
      # faces because the licence requires it, not as a courtesy.
      #
      # `base.css` is a plan and not a file (design-system.md records that
      # row as one). It is copied when it exists, so the release that first
      # carries it needs no change here.
      - name: Assemble the design artefact
        id: assemble
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/telecraft-design-$TAG"
          mkdir -p "$staged/fonts" "$staged/icons"
          cp console/src/tokens.css "$staged/"
          cp console/src/fonts/fonts.css "$staged/fonts/"
          cp console/src/fonts/*.woff2 "$staged/fonts/"
          cp console/src/fonts/*-OFL.txt "$staged/fonts/"
          if [ -f console/src/base.css ]; then
            cp console/src/base.css "$staged/"
          else
            echo "note: base.css is not in the tree yet; the archive carries the tokens and the faces only"
          fi
          # The mark travels with the sheets, so a consumer gets the whole
          # design system from one versioned artefact instead of fetching
          # the icons by raw URL from console/public/ (ADR-0047 §1).
          #
          # These are the generated bytes, not a second copy of the artwork:
          # docs/branding/pack/tools/build.py writes favicon.svg and
          # render.sh rasterises the rest from that one SVG. Taking them
          # from console/public/ is what makes the archive's mark and the
          # console's mark the same file by construction.
          #
          # icons/ is a sibling of fonts/ because it is the same kind of
          # thing: a directory of files a site serves, kept whole. Unlike
          # fonts/ nothing inside it points at anything else, so a consumer
          # is free to move the five files to wherever its HTML head and
          # its web app manifest name them.
          cp console/public/favicon.svg "$staged/icons/"
          cp console/public/favicon.ico "$staged/icons/"
          cp console/public/icon-192.png "$staged/icons/"
          cp console/public/icon-512.png "$staged/icons/"
          cp console/public/apple-touch-icon.png "$staged/icons/"
          # ELv2's Notices clause: anyone who gets a copy of any part of the
          # software also gets a copy of the terms (ADR-0050). The archive
          # carries tokens.css, base.css and the mark, which are this
          # project's work, so it carries the licence beside them. The two
          # OFL texts in fonts/ cover the faces and cover nothing else.
          cp LICENSE "$staged/"
          printf '%s\n' "$TAG" > "$staged/VERSION"
          # The archive's README is a file rather than a heredoc, and the
          # copy is the whole of what happens to it: nothing in the text is
          # substituted, so there is no template to get wrong. It is prose a
          # consumer reads, and prose written inside a workflow is prose no
          # lint can see. Two decision references lived in it for as long as
          # it existed for exactly that reason. As a file it sits in the
          # `published` scope of vendorlint.yaml and is held to the same
          # house style as any other page, and it reviews as a prose diff
          # rather than as a change to a shell script.
          cp docs/branding/design-artefact-readme.md "$staged/README.md"
          echo "staged=$staged" >> "$GITHUB_OUTPUT"
          ls -R "$staged"

      # The accessibility floors are numbers, so they can be regressed
      # (ADR-0047 consequences). CI runs this check over `console/src` when
      # the console changes; here it runs over the exact bytes about to be
      # published, because a release is the copy other people build against
      # and the check is worth more against the artefact than beside it.
      # The script takes the stylesheet as an argument and needs no install.
      - name: The palette floors hold on the file being shipped
        env:
          STAGED: ${{ steps.assemble.outputs.staged }}
        run: node console/tools/check-palette.mjs "$STAGED/tokens.css"

      # Packed with sorted names, fixed ownership and the tag's own commit
      # date, so re-cutting the same tag produces the same archive and the
      # checksum is a fact about the tag rather than about the runner that
      # happened to build it.
      # The three the image has no use for. Built here rather than in
      # `tools/image/stage.sh`, because that script stages a build context
      # and a macOS binary inside a Linux image's context is a file that
      # travels for no reason.
      - name: Build the workstation binaries
        id: workstations
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/workstations"
          mkdir -p "$out"
          for target in darwin/arm64 darwin/amd64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="telecraft-$TAG-$os-$arch"
            if [ "$os" = "windows" ]; then
              name="$name.exe"
            fi
            echo "building $target"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -o "$out/$name" ./cmd/telecraft
          done
          echo "out=$out" >> "$GITHUB_OUTPUT"

      - name: Pack and checksum
        id: pack
        env:
          TAG: ${{ github.ref_name }}
          STAGED: ${{ steps.assemble.outputs.staged }}
          WORKSTATIONS: ${{ steps.workstations.outputs.out }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/artefacts"
          mkdir -p "$out"
          archive="telecraft-design-$TAG.tar.gz"
          epoch=$(git log -1 --pretty=%ct "$GITHUB_SHA")
          tar --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime="@$epoch" \
              -czf "$out/$archive" \
              -C "$(dirname "$STAGED")" "$(basename "$STAGED")"
          cp dist/image/telecraft-linux-amd64 "$out/telecraft-$TAG-linux-amd64"
          cp dist/image/telecraft-linux-arm64 "$out/telecraft-$TAG-linux-arm64"
          cp "$WORKSTATIONS"/telecraft-* "$out/"
          cd "$out"
          # Every binary a reader can download, in one file beside them, so
          # checking one is the same command as checking all of them.
          sha256sum "$archive" telecraft-"$TAG"-* > SHA256SUMS
          cat SHA256SUMS
          echo "out=$out" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            ${{ steps.pack.outputs.out }}/telecraft-*-linux-*
            ${{ steps.pack.outputs.out }}/telecraft-*-darwin-*
            ${{ steps.pack.outputs.out }}/telecraft-*-windows-*
            ${{ steps.pack.outputs.out }}/${{ steps.pack.outputs.archive }}

      # The notes are composed rather than left to `--generate-notes` alone:
      # the generated half is the commit list, and the half above it says
      # what the release contains and what it does not, which is the part a
      # reader arriving from another repository needs. House style applies
      # to release notes like any other prose
      # (docs/contributing/documentation.md).
      #
      # The two lines the notes open with come from the tag's own
      # annotation, validated by the headline guard at the top of this job
      # before anything was built or pushed. A release is a tag, so the
      # sentence about what the release asks of a consumer belongs on the
      # tag rather than in a file that a later commit could edit out from
      # under it.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
          OUT: ${{ steps.pack.outputs.out }}
          # Two lines the release notes open with, so the version number can
          # be audited against them (docs/contributing/releases.md). Composed
          # by hand at the tag rather than derived: what a release asks of a
          # consumer is a judgement, and a workflow that guessed it would be
          # guessing the number too. The tag's annotation is where it lives,
          # and `Breaking: none` is a normal answer.
          HEADLINE: ${{ steps.headline.outputs.text }}
          ARCHIVE: ${{ steps.pack.outputs.archive }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "Telecraft is pre-1.0 and this tag makes no compatibility promise. What a"
            echo "version number means, and what a release is for, is in"
            echo "[Releases](https://github.com/telecraft-dev/telecraft/blob/$TAG/docs/contributing/releases.md)."
            echo
            echo "$HEADLINE"
            echo
            echo "**In this release**"
            echo
            echo "- The source at \`$TAG\`. This is the ref the public demo builds from,"
            echo "  and the ref a contributor builds from."
            echo "- \`$ARCHIVE\`, the design artefacts: the design tokens, the base sheet once"
            echo "  it exists, the two self-hosted families with their licences, and the"
            echo "  brand mark in the five formats a browser is offered. It carries"
            echo "  \`LICENSE\` too, because Elastic License 2.0 asks that anyone given"
            echo "  part of the software is given the terms with it. \`SHA256SUMS\`"
            echo "  covers the archive."
            echo
            echo "- \`ghcr.io/telecraft-dev/telecraft:$TAG\`, the container image for"
            echo "  \`linux/amd64\` and \`linux/arm64\`. Pin the digest:"
            echo "  \`ghcr.io/telecraft-dev/telecraft@$DIGEST\`."
            echo "- The Helm chart at \`oci://ghcr.io/telecraft-dev/charts/telecraft\`,"
            echo "  version \`${TAG#v}\`, which installs the image above."
            echo "- The CLI, as \`telecraft-$TAG-<os>-<arch>\`, for Linux, macOS and"
            echo "  Windows on amd64 and on Apple silicon. One static file, no toolchain"
            echo "  and no installer; the [quickstart](https://github.com/telecraft-dev/telecraft/blob/$TAG/docs/guides/quickstart.md)"
            echo "  downloads it. \`SHA256SUMS\` covers every one of them. The Windows"
            echo "  build is attached and is not otherwise exercised: nothing in CI runs"
            echo "  it."
            echo
            gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG" --jq .body
          } > "$notes"
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$notes" \
            "${flags[@]}" \
            "$OUT/$ARCHIVE" \
            "$OUT"/telecraft-"$TAG"-* \
            "$OUT/SHA256SUMS"
