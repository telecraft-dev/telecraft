name: Demo

# The demo at demo.telecraft.dev is the real console over a curated estate,
# built and published from telecraft-dev/estate-demo. That repository runs
# this repository's own evaluators over its YAML and builds the console from
# this repository, so almost any change here changes what the demo shows.
#
# It used to build from `main`, and this workflow used to fire on every
# non-documentation push, because a change that never reached the demo was
# invisible. The demo is also the first thing most people see of Telecraft,
# and a bug that reaches main reaches them (issue #86). So the demo now
# builds from a release, and between releases it lags: that is the ruling in
# ADR-0049 §4, and the reason it is the right one is that a change on main is
# already exercised before it merges, because ci.yml's demo job builds the snapshot
# and the demo bundle on every pull request that touches them. A staging site
# would be a second deployment, a second domain and a second published claim
# to keep honest, to catch what CI catches first.
#
# THE REF THE DEMO CHECKS OUT MUST BE THE SAME FOR EVERY TRIGGER.
#
# That constraint is what shapes the rest of this file, and it is not
# obvious. estate-demo builds on three events: a push to its own estate, a
# manual run, and the dispatch below. Only the manual run can carry a ref,
# and a repository dispatch carries no inputs at all. So if the pinned ref
# arrived in the dispatch payload, an estate content push (a card added, a
# reading edited) would build against the fallback instead, and which
# platform version the public site runs would depend on which event happened
# to fire last. Whatever the fallback names is therefore the pin, and it has
# to name the current release on every one of those events.
#
# A literal tag in estate-demo would satisfy that, at the cost of an edit in
# a second repository on every release, and it would leave this workflow with
# nothing to say: a dispatch on a tag push would ask for a rebuild at a ref
# that had not moved. So the pin is a pointer. `release` is a tag this
# workflow moves to each new stable version, estate-demo's fallback names it
# once and never again, and the version tags stay exactly what they were:
# immutable, and the honest answer to what a release is.
#
# `release` is not GitHub's "latest release", which is a mutable property of
# the releases page that a human can change from the UI. It is a git ref, it
# moves here or nowhere, and `git rev-parse release` answers what the demo is
# built from.
#
# This runs when release.yml has finished for the tag, and the job below
# runs only when it succeeded. estate-demo builds the platform from source
# at the ref, so it needs no artefact release.yml produces; what the
# ordering buys is narrower and worth having anyway: the public pointer
# never moves for a tag whose release failed its own checks.
#
# On a workflow_run event the tag's name travels as `head_branch` and its
# commit as `head_sha`; the run's own `github.sha` names main, not the tag.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  # To move the `release` pointer. The dispatch to estate-demo is authorised
  # separately, by the App token minted below.
  contents: write

# One pointer, one mover at a time, never cancelled mid-move.
concurrency:
  group: demo-pointer

jobs:
  publish-demo:
    name: Point the demo at this release
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Every tag, and the history behind them, because the decision below
      # asks whether this is the newest stable version. Credentials stay
      # persisted: the move step pushes the pointer with them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The same two guards release.yml opens with, for the same footgun:
      # nothing else stands between a pushed ref and the public demo. They
      # are repeated here rather than trusted to the ordering above,
      # because a manual run of the Release workflow is not the only thing
      # that can complete it, and a guard that lives in another file is a
      # guard someone edits away without noticing this one relied on it.
      # A manual run of this workflow carries no tag and moves nothing, so
      # there is nothing for these to check.
      - name: The tag is well formed and sits on main
        if: github.event_name == 'workflow_run'
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::$TAG is not vMAJOR.MINOR.PATCH[-prerelease] (ADR-0049 §1)"
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$TAG points at $SHA, which is not on main (ADR-0049 §2)"
            exit 1
          fi

      # Three cases, and only the first one reaches the public site.
      #
      # A new stable tag moves the pointer and asks for a rebuild.
      #
      # A pre-release tag does neither. `v0.3.0-rc.1` publishes its artefacts
      # through release.yml and stops there, which is what makes it a
      # rehearsal: the whole release path can be exercised without the demo
      # moving (ADR-0049 §6).
      #
      # A tag that is not the newest stable version does neither either. A
      # v0.2.4 cut after v0.3.0 exists is a fix on an older line, and dragging
      # the pointer backwards would take the demo with it.
      #
      # A manual run asks for a rebuild without moving anything: the pointer
      # already names the release the demo should be on, and this is how you
      # ask again after a transient failure over there.
      - name: Decide what this event means for the demo
        id: decide
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          move=false
          notify=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            notify=true
            echo "Manual run: rebuilding at whatever release names now."
          else
            case "$TAG" in
              *-*)
                echo "$TAG is a pre-release: artefacts only, the demo stays where it is."
                ;;
              *)
                # No `head` in this pipeline: with `pipefail` a reader that
                # closes early can fail the step for no reason.
                stable=$(git tag --list 'v*' --sort=-v:refname | grep -v -- '-' || true)
                newest=$(printf '%s\n' "$stable" | sed -n '1p')
                if [ "$newest" = "$TAG" ]; then
                  move=true
                  notify=true
                  echo "$TAG is the newest stable version: the demo follows it."
                else
                  echo "$TAG is older than $newest: the demo stays on $newest."
                fi
                ;;
            esac
          fi
          echo "move=$move"     >> "$GITHUB_OUTPUT"
          echo "notify=$notify" >> "$GITHUB_OUTPUT"

      # Forced, because a pointer that could not be moved would not be one.
      # The version tag it now names is untouched and stays the record.
      - name: Move the release pointer to this tag
        if: steps.decide.outputs.move == 'true'
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git tag --force release "$SHA"
          git push --force origin refs/tags/release
          echo "release now names $TAG ($SHA)."

      # The same App the forge adapter uses (ADR-0014). It needs access to
      # estate-demo in its installation; without that the token request
      # fails and this job goes red, which is the point: a release that
      # never reaches the demo should be visible, not silent. That is the
      # same contract docs-dispatch.yml holds for the documentation site.
      - name: Mint an App token for estate-demo
        if: steps.decide.outputs.notify == 'true'
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.FORGE_APP_ID }}
          private-key: ${{ secrets.FORGE_APP_PRIVATE_KEY }}
          owner: telecraft-dev
          repositories: estate-demo

      # A repository dispatch, the same shape docs-dispatch.yml uses, and
      # for the same reason: it needs Contents write, which the App holds,
      # where dispatching a workflow directly needs Actions write, which it
      # does not. The first attempt at this used `gh workflow run` and
      # failed with `403 Resource not accessible by integration`.
      #
      # The payload is a record, not an instruction. estate-demo checks out
      # the pointer, for the reason at the top of this file; what travels
      # here is what that pointer was moved to, so the run over there says in
      # its own log which release it was asked for.
      - name: Ask the demo to rebuild from this release
        if: steps.decide.outputs.notify == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          DEMO_SHA: ${{ github.event.workflow_run.head_sha }}
          DEMO_REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          # A manual run carries no tag, so the record names what the
          # pointer already names, which is what the demo will build.
          if [ -z "$DEMO_REF" ]; then
            DEMO_SHA=$(git rev-parse release)
            DEMO_REF=release
          fi
          jq -n \
            --arg sha "$DEMO_SHA" \
            --arg ref "$DEMO_REF" \
            '{event_type: "console-updated", client_payload: {sha: $sha, ref: $ref}}' \
          | gh api -X POST /repos/telecraft-dev/estate-demo/dispatches --input -
          echo "Asked estate-demo to rebuild the demo from $DEMO_REF."
