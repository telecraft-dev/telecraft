<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Telecraft">
  <title>Telecraft</title>
  <!-- The three reading bands of the card face, stacked (ADR-0041 §2):
       the console's own shape, drawn in currentColor-neutral tones so the
       mark carries no hue the contract does not have. -->
  <rect width="32" height="32" rx="6" fill="#1e2b3a"/>
  <rect x="7" y="8" width="18" height="3" rx="1.5" fill="#e8eef5"/>
  <rect x="7" y="14.5" width="18" height="3" rx="1.5" fill="#9fb3c8"/>
  <rect x="7" y="21" width="11" height="3" rx="1.5" fill="#5b6b7d"/>
</svg>
