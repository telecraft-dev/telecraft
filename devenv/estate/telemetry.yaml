# The estate-level self-telemetry destination (REQ-053, ADR-0039 §2). The
# devenv has one backend, so self-telemetry and data telemetry land in the
# same place; a production estate points this somewhere the main path's
# outage cannot also blind (see estate-demo, which splits them).
#
# The host resolves on the compose network, and the exporter appends the
# signal path, so this becomes /_otlp/v1/metrics at run time.
self_telemetry:
  endpoint: http://elasticsearch:9200/_otlp
  protocol: http/protobuf
