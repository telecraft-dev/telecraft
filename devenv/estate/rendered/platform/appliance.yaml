# Generated by the telecraft renderer. Do not edit by hand: change the source in git and render again.
# Tier platform/appliance (production), Blueprint platform/appliance-standard@1, commit d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0.
receivers:
  otlp/otlp-in:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  # Generated: this Tier receives data over an untrusted Hop, so this
  # processor drops every telecraft.* attribute on arrival. Identity
  # comes from this Tier's own stamps, never from inbound data.
  attributes/telecraft.untrusted-hop:
    actions:
      - action: delete
        pattern: ^telecraft\.
  batch/batcher:
    send_batch_size: 512
    timeout: 2s
exporters:
  otlp_http/platform.backend-exporter:
    compression: gzip
    endpoint: http://elasticsearch:9200/_otlp
    retry_on_failure:
      enabled: true
      max_elapsed_time: 60s
    sending_queue:
      queue_size: 1000
extensions:
  health_check/health:
    endpoint: 0.0.0.0:13133
  opamp/reporting:
    agent_description:
      non_identifying_attributes:
        deployment.environment: production
        telecraft.tier: appliance
    capabilities:
      reports_effective_config: true
      reports_health: true
    server:
      ws:
        endpoint: ws://host.docker.internal:4320/v1/opamp
service:
  extensions:
    - health_check/health
    - opamp/reporting
  pipelines:
    traces:
      receivers:
        - otlp/otlp-in
      processors:
        - attributes/telecraft.untrusted-hop
        - batch/batcher
      exporters:
        - otlp_http/platform.backend-exporter
    metrics:
      receivers:
        - otlp/otlp-in
      processors:
        - attributes/telecraft.untrusted-hop
        - batch/batcher
      exporters:
        - otlp_http/platform.backend-exporter
    logs:
      receivers:
        - otlp/otlp-in
      processors:
        - attributes/telecraft.untrusted-hop
        - batch/batcher
      exporters:
        - otlp_http/platform.backend-exporter
  telemetry:
    resource:
      # Node-unique identity via the Downward API: the install guide sets
      # TELECRAFT_NODE_NAME from spec.nodeName, so one DaemonSet manifest
      # gives each node its own identity.
      k8s.node.name: ${env:TELECRAFT_NODE_NAME}
      # The artefact carries its own identity: the commit it was rendered from.
      telecraft.commit: d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0
      # The Tier this artefact belongs to. With the commit stamp, it joins
      # each self-telemetry reading back to the artefact that produced it.
      telecraft.tier: platform/appliance
    # Self-telemetry goes to the estate's declared destination over its
    # own exporter and connection, never through this Tier's data
    # pipelines. Internal traces stay off in v1. These exporters take the
    # endpoint as the complete URL, so the renderer adds the signal path
    # here rather than at run time.
    metrics:
      level: normal
      readers:
        - periodic:
            exporter:
              otlp:
                endpoint: http://elasticsearch:9200/_otlp/v1/metrics
                protocol: http/protobuf
    logs:
      processors:
        - batch:
            exporter:
              otlp:
                endpoint: http://elasticsearch:9200/_otlp/v1/logs
                protocol: http/protobuf
