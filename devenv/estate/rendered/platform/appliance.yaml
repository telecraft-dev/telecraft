# Generated by the telecraft renderer — humans never commit here (ADR-0027, ADR-0028).
# Tier platform/appliance (production), Blueprint platform/appliance-standard@1, commit d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0.
receivers:
  otlp/otlp-in:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  # Generated: data crossing an untrusted Hop sheds the platform's
  # attribute namespace; identity is re-derived from this Tier's own
  # stamps, never from inbound data (REQ-034, ADR-0007, ADR-0013).
  attributes/telecraft.untrusted-hop:
    actions:
      - action: delete
        pattern: ^telecraft\.
  batch/batcher:
    send_batch_size: 512
    timeout: 2s
exporters:
  otlp_http/platform.backend-exporter:
    compression: gzip
    endpoint: http://elasticsearch:9200/_otlp
    retry_on_failure:
      enabled: true
      max_elapsed_time: 60s
    sending_queue:
      enabled: true
      queue_size: 1000
extensions:
  health_check/health:
    endpoint: 0.0.0.0:13133
  opamp/reporting:
    agent_description:
      non_identifying_attributes:
        deployment.environment: production
        telecraft.tier: appliance
    capabilities:
      reports_effective_config: true
      reports_health: true
    server:
      ws:
        endpoint: ws://host.docker.internal:4320/v1/opamp
service:
  extensions:
    - health_check/health
    - opamp/reporting
  pipelines:
    traces:
      receivers:
        - otlp/otlp-in
      processors:
        - attributes/telecraft.untrusted-hop
        - batch/batcher
      exporters:
        - otlp_http/platform.backend-exporter
    metrics:
      receivers:
        - otlp/otlp-in
      processors:
        - attributes/telecraft.untrusted-hop
        - batch/batcher
      exporters:
        - otlp_http/platform.backend-exporter
    logs:
      receivers:
        - otlp/otlp-in
      processors:
        - attributes/telecraft.untrusted-hop
        - batch/batcher
      exporters:
        - otlp_http/platform.backend-exporter
  telemetry:
    resource:
      # Node-unique identity via the Downward API: install guidance feeds
      # TELECRAFT_NODE_NAME from spec.nodeName, so one DaemonSet manifest
      # yields per-node identity (REQ-034, ADR-0010).
      k8s.node.name: ${env:TELECRAFT_NODE_NAME}
      # The artefact carries its own identity (ADR-0013).
      telecraft.commit: d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0d0
      # The Tier half of the reading join: reading → (Tier, SHA) → artefact
      # → claims (ADR-0039 §5). A reading, never a back-door Effective.
      telecraft.tier: platform/appliance
    # Self-telemetry pushes to the estate's declared destination over its
    # own exporter and connection — never through this Tier's own data
    # pipelines (REQ-053, ADR-0039 §2). Internal traces stay off in v1.
    # These exporters take the endpoint as the complete URL, so the signal
    # path is rendered in rather than appended at run time (ADR-0053).
    metrics:
      level: normal
      readers:
        - periodic:
            exporter:
              otlp:
                endpoint: http://elasticsearch:9200/_otlp/v1/metrics
                protocol: http/protobuf
    logs:
      processors:
        - batch:
            exporter:
              otlp:
                endpoint: http://elasticsearch:9200/_otlp/v1/logs
                protocol: http/protobuf
