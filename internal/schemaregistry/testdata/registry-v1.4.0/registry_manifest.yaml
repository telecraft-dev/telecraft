# A representative custom registry, of the shape ADR-0009 adopts and
# ADR-0034 §1 imports: the OpenTelemetry conventions imported, requirement
# levels tightened locally, and the adopter's own namespaced attributes
# added. An adopter's registry is adopter-authored by definition, so this
# fixture is authored rather than a snapshot of anybody's tree.
name: example-registry
description: >
  The shape declaration for the example estate's telemetry.
schema_url: https://schemas.example.test/registry/1.4.0
dependencies:
  - name: otel
    schema_url: https://opentelemetry.io/schemas/1.34.0
    registry_path: https://github.com/open-telemetry/semantic-conventions/archive/refs/tags/v1.34.0.zip[model]
