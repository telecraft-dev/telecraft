# Generated by the telecraft renderer. Do not edit by hand: change the source in git and render again.
# Tier data-flow/gateway-staging (staging), Blueprint data-flow/gateway-standard@4, commit 8b7df143d91c716ecfa5fc1730022f6b421b05cd.
receivers:
  otlp/otlp-in:
    protocols:
      grpc: {}
processors:
  # Generated: this Tier receives data over an untrusted Hop, so this
  # processor drops every telecraft.* attribute on arrival. Identity
  # comes from this Tier's own stamps, never from inbound data.
  attributes/telecraft.untrusted-hop:
    actions:
      - action: delete
        pattern: ^telecraft\.
  batch/batcher: {}
  memory_limiter/guard:
    check_interval: 1s
    limit_mib: 512
  transform/infosec.pii-redaction:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - replace_pattern(body, "\\b\\d{16}\\b", "****")
exporters:
  otlphttp/data-flow.gateway-exporter:
    endpoint: https://gateway.internal:4318
extensions:
  health_check/health: {}
  opamp/reporting:
    server:
      ws:
        endpoint: wss://opamp.telecraft.internal/v1/opamp
service:
  extensions:
    - health_check/health
    - opamp/reporting
  pipelines:
    traces:
      receivers:
        - otlp/otlp-in
      processors:
        - attributes/telecraft.untrusted-hop
        - memory_limiter/guard
        - transform/infosec.pii-redaction
        - batch/batcher
      exporters:
        - otlphttp/data-flow.gateway-exporter
    metrics:
      receivers:
        - otlp/otlp-in
      processors:
        - attributes/telecraft.untrusted-hop
        - memory_limiter/guard
        - batch/batcher
      exporters:
        - otlphttp/data-flow.gateway-exporter
    logs:
      receivers:
        - otlp/otlp-in
      processors:
        - attributes/telecraft.untrusted-hop
        - memory_limiter/guard
        - transform/infosec.pii-redaction
        - batch/batcher
      exporters:
        - otlphttp/data-flow.gateway-exporter
  telemetry:
    resource:
      # Node-unique identity via the Downward API: the install guide sets
      # TELECRAFT_NODE_NAME from spec.nodeName, so one DaemonSet manifest
      # gives each node its own identity.
      k8s.node.name: ${env:TELECRAFT_NODE_NAME}
      # The artefact carries its own identity: the commit it was rendered from.
      telecraft.commit: 8b7df143d91c716ecfa5fc1730022f6b421b05cd
      # The Tier this artefact belongs to. With the commit stamp, it joins
      # each self-telemetry reading back to the artefact that produced it.
      telecraft.tier: data-flow/gateway-staging
    # Self-telemetry goes to the estate's declared destination over its
    # own exporter and connection, never through this Tier's data
    # pipelines. Internal traces stay off in v1. These exporters take the
    # endpoint as the complete URL, so the renderer adds the signal path
    # here rather than at run time.
    metrics:
      level: normal
      readers:
        - periodic:
            exporter:
              otlp:
                endpoint: https://otlp.observability.internal:4318/v1/metrics
                protocol: http/protobuf
    logs:
      processors:
        - batch:
            exporter:
              otlp:
                endpoint: https://otlp.observability.internal:4318/v1/logs
                protocol: http/protobuf
