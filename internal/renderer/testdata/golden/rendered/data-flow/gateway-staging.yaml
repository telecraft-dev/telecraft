# Generated by the telecraft renderer — humans never commit here (ADR-0027, ADR-0028).
# Tier data-flow/gateway-staging (staging), Blueprint data-flow/gateway-standard@4, commit 8b7df143d91c716ecfa5fc1730022f6b421b05cd.
receivers:
  otlp/otlp-in:
    protocols:
      grpc: {}
processors:
  # Generated: data crossing an untrusted Hop sheds the platform's
  # attribute namespace; identity is re-derived from this Tier's own
  # stamps, never from inbound data (REQ-034, ADR-0007, ADR-0013).
  attributes/telecraft.untrusted-hop:
    actions:
      - action: delete
        pattern: ^telecraft\.
  batch/batcher: {}
  memory_limiter/guard:
    check_interval: 1s
    limit_mib: 512
  transform/infosec.pii-redaction:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - replace_pattern(body, "\\b\\d{16}\\b", "****")
exporters:
  otlphttp/data-flow.gateway-exporter:
    endpoint: https://gateway.internal:4318
extensions:
  health_check/health: {}
  opamp/reporting:
    server:
      ws:
        endpoint: wss://opamp.telecraft.internal/v1/opamp
service:
  extensions:
    - health_check/health
    - opamp/reporting
  pipelines:
    traces:
      receivers:
        - otlp/otlp-in
      processors:
        - attributes/telecraft.untrusted-hop
        - memory_limiter/guard
        - transform/infosec.pii-redaction
        - batch/batcher
      exporters:
        - otlphttp/data-flow.gateway-exporter
    metrics:
      receivers:
        - otlp/otlp-in
      processors:
        - attributes/telecraft.untrusted-hop
        - memory_limiter/guard
        - batch/batcher
      exporters:
        - otlphttp/data-flow.gateway-exporter
    logs:
      receivers:
        - otlp/otlp-in
      processors:
        - attributes/telecraft.untrusted-hop
        - memory_limiter/guard
        - transform/infosec.pii-redaction
        - batch/batcher
      exporters:
        - otlphttp/data-flow.gateway-exporter
  telemetry:
    resource:
      # Node-unique identity via the Downward API: install guidance feeds
      # TELECRAFT_NODE_NAME from spec.nodeName, so one DaemonSet manifest
      # yields per-node identity (REQ-034, ADR-0010).
      k8s.node.name: ${env:TELECRAFT_NODE_NAME}
      # The artefact carries its own identity (ADR-0013).
      telecraft.commit: 8b7df143d91c716ecfa5fc1730022f6b421b05cd
      # The Tier half of the reading join: reading → (Tier, SHA) → artefact
      # → claims (ADR-0039 §5). A reading, never a back-door Effective.
      telecraft.tier: data-flow/gateway-staging
    # Self-telemetry pushes to the estate's declared destination over its
    # own exporter and connection — never through this Tier's own data
    # pipelines (REQ-053, ADR-0039 §2). Internal traces stay off in v1.
    metrics:
      level: normal
      readers:
        - periodic:
            exporter:
              otlp:
                endpoint: https://otlp.observability.internal:4318
                protocol: http/protobuf
    logs:
      processors:
        - batch:
            exporter:
              otlp:
                endpoint: https://otlp.observability.internal:4318
                protocol: http/protobuf
