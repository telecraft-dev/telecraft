# The gateway Blueprint: per-signal lanes in explicit order, local
# Components inline, shared Components by pinned reference at head
# (ADR-0024, ADR-0026). The local `reporting` extension is of catalogue
# type opamp — the renderer must emit it as opamp/reporting, never bare
# opamp (REQ-034, ADR-0010).
name: gateway-standard
version: 4
owner: gateway-owners
components:
  - name: otlp-in
    class: receiver
    type: otlp
    version: 1
    config:
      protocols:
        grpc: {}
  - name: guard
    class: processor
    type: memory_limiter
    version: 2
    config:
      check_interval: 1s
      limit_mib: 512
  - name: batcher
    class: processor
    type: batch
    version: 1
  - name: health
    class: extension
    type: health_check
    version: 1
  - name: reporting
    class: extension
    type: opamp
    version: 1
    config:
      server:
        ws:
          endpoint: wss://opamp.telecraft.internal/v1/opamp
pipelines:
  traces:
    - component: otlp-in
    - component: guard
    - component: infosec/pii-redaction@3
    - component: batcher
    - component: data-flow/gateway-exporter@2
  logs:
    - component: otlp-in
    - component: guard
    - component: infosec/pii-redaction@3
    - component: batcher
    - component: data-flow/gateway-exporter@2
  metrics:
    - component: otlp-in
    - component: guard
    - component: batcher
    - component: data-flow/gateway-exporter@2
extensions:
  - component: health
  - component: reporting
