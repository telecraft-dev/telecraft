# The production gateway: served over OpAMP (supervisor.yaml renders
# beside the collector artefact, REQ-032), with one untrusted arrival —
# trust is a property of the Hop, never the Tier (ADR-0007), and the
# undeclared trust level on the internet Hop fails safe to untrusted.
owner: gateway-owners
environment: production
blueprint: data-flow/gateway-standard@4
selector:
  telecraft.tier: gateway
  deployment.environment: production
serving:
  endpoint: wss://opamp.telecraft.internal/v1/opamp
hops:
  - from: internet
  - from: data-flow/edge
    trusted: true
