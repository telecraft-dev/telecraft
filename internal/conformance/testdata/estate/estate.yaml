# A fixture estate: each Service, the Environments it is deployed to, and
# the Effective reading the fixture asserts per (Service, Environment):
# pipelines with component order preserved (ADR-0004). The same Service in
# two environments is two rows, judged independently (ADR-0033).
services:
  - name: checkout
    environments:
      - name: production
        pipelines:
          - name: logs
            receivers: [filelog, otlp]
            processors: [resource, batch]
            exporters: [otlphttp]
          - name: traces
            receivers: [otlp]
            processors: [batch]
            exporters: [otlphttp]
      - name: staging
        pipelines:
          - name: traces
            receivers: [otlp]
            processors: [batch]
            exporters: [otlphttp]
  - name: billing
    environments:
      - name: production
        # A collector reporting an empty config: a known reading of nothing,
        # never a blind spot.
        pipelines: []
