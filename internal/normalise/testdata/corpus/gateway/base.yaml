# Gateway-tier collector: OTLP in, tail-batched OTLP out.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
  attributes/strip-untrusted:
    actions:
      - key: internal.cost.centre
        action: delete
  batch:
    send_batch_max_size: 16384
exporters:
  otlphttp/backend:
    endpoint: https://ingest.example.com:443
    headers:
      x-api-token: tok-example-123
service:
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - attributes/strip-untrusted
        - batch
      exporters:
        - otlphttp/backend
    metrics:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch
      exporters:
        - otlphttp/backend
