# A scope naming an attribute namespace the pinned registry version carries
# nothing in. Refused for the same reason a mistyped group id is.
id: unknown-namespace
title: Demands a namespace the registry carries nothing in
version: 1
owner: platform-observability
schema_conformance:
  registry_version: v1.4.0
  scope:
    namespaces: [messaging]
  signals: [traces]
  window: 24h
remediation: name a namespace the registry carries attributes in
