apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: telecraft-opamp
  labels:
    helm.sh/chart: telecraft-0.0.0
    app.kubernetes.io/name: telecraft
    app.kubernetes.io/instance: telecraft
    app.kubernetes.io/version: "v0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  ingressClassName: "nginx"
  tls:
    - hosts:
        - "opamp.telecraft.example"
      secretName: "opamp-telecraft-tls"
  rules:
