{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "telecraft.serviceAccountName" . }}
  labels:
    {{- include "telecraft.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The Instance server reads no Kubernetes API, so the account holds no
# role and needs no token mounted into the pod.
automountServiceAccountToken: false
{{- end }}
